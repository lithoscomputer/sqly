name: Release verification

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install locked tools
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          version: 2026.6.11
          install_args: --locked --jobs=1
          cache: false

      # Mise's cache can restore Rust links without rustup's toolchain components.
      - name: Ensure Rust toolchains and components
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy
          rustup toolchain install 1.94.0 --profile minimal
          rustup toolchain install nightly-2026-04-14 --profile minimal --component rustfmt

      - name: Verify library release candidate
        env:
          SQLY_TEST_BACKEND: ${{ runner.os == 'macOS' && 'sqlite' || 'both' }}
        run: mise run release
