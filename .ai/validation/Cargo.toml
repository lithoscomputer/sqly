[package]
name = "sqly-validation"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace]

[features]
default = ["sqlite", "postgres"]
sqlite = ["sqlx/sqlite"]
postgres = ["sqlx/postgres"]

[dependencies]
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "uuid", "time", "json"] }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
futures-core = "=0.3.33"
futures-util = { version = "=0.3.33", default-features = false, features = ["std", "async-await"] }
uuid = { version = "=1.24.0", features = ["v4"] }
time = { version = "=0.3.55", features = ["formatting", "parsing"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
async-stream = "=0.3.6"

[lints.rust]
unsafe_code = "deny"
