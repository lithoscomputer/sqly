[package]
name = "sqly"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
description = "Async SQL library for applications using SQLite and PostgreSQL"
readme = "README.md"
include = ["/src/**", "/tests/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/DEVELOPING.md"]

[features]
default = []
sqlite = ["sqlx/sqlite"]
postgres = ["sqlx/postgres"]
uuid = ["dep:uuid", "sqlx/uuid"]
time = ["dep:time", "sqlx/time"]
json = ["dep:serde_json", "sqlx/json"]
migrate = ["dep:sha2"]
ambient = ["tokio/sync"]

[dependencies]
async-stream = "=0.3.6"
futures-core = "=0.3.33"
futures-util = { version = "=0.3.33", default-features = false, features = ["std", "async-await"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring"] }
tokio = { version = "=1.53.1", default-features = false, features = ["sync"] }
url = "=2.5.8"
percent-encoding = "=2.3.2"
uuid = { version = "=1.24.0", optional = true }
time = { version = "=0.3.55", features = ["formatting", "parsing"], optional = true }
serde_json = { version = "=1.0.151", optional = true }
sha2 = { version = "=0.10.9", optional = true }

[dev-dependencies]
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "time"] }

[lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -2 }
allow_attributes_without_reason = "warn"

implicit_hasher = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
cast_precision_loss = "allow"
doc_markdown = "allow"

print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
empty_drop = "warn"
empty_structs_with_brackets = "warn"
disallowed_methods = "deny"
exit = "warn"
get_unwrap = "warn"
unwrap_used = "deny"
rc_buffer = "warn"
rc_mutex = "warn"
rest_pat_in_fully_bound_structs = "warn"
use_self = "warn"
wildcard_imports = "warn"
absolute_paths = "warn"
